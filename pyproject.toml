[project]
name = "macro-mcp"
version = "0.1.0"
description = "MCP server for free international macro, entity and FX data"
readme = "README.md"
authors = [
    { name = "rabidlego25", email = "geneatabb@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    # Imported directly, not just pulled in by sdmx1. Left undeclared, the
    # install works until one of sdmx1's own pins moves.
    "pandas>=2.0",
    "requests>=2.32",
    "requests-cache>=1.3.3",
    "sdmx1>=2.27.0",
]

[project.scripts]
macro-mcp = "macro_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
