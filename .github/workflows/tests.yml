# Three jobs, because two different things can go red and they mean opposite
# things. Structure breaking is a defect. A number moving is the data doing
# what this project exists to point out, and running the two together trains
# you to ignore both.
name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly. Almost everything perishable here is a hand-maintained table —
    # corrected base URLs, a probed capability table, per-provider quirks, 125
    # HKMA slugs — and nothing else notices when one goes stale.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  offline:
    name: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  live:
    name: live (providers still answer)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Structure only. Red here means a provider moved or renamed something,
      # or this server broke — either way it needs a person.
      - run: uv run pytest -q -m "not revisable"
        env:
          MACRO_MCP_LIVE: "1"

  revisions:
    name: revisions (what the data did)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never fails the run. A red step here is a report that a provider revised
    # or rebased a series — the thing the archive is supposed to be a record
    # of, and the reason not to let it share a signal with breakage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -m revisable -rA
        env:
          MACRO_MCP_LIVE: "1"
